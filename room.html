<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ORIGINAL DUO</title>
  <style>
    body { background:#111126; color:white; font-family:Arial, sans-serif; text-align:center; padding:30px 15px; }
    .room { max-width:650px; margin:25px auto 0; background:#1a1a36; border:1px solid #353566; border-radius:16px; padding:20px; }
    .profiles { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:15px; }
    .seat { flex:1; min-width:150px; padding:12px; border-radius:12px; background:#111126; border:2px solid transparent; cursor:pointer; }
    .seat.active { border-color:#c9a5ff; background:#232347; }
    .chat-box { height:280px; overflow-y:auto; background:#0d0d1f; border-radius:12px; padding:15px; text-align:left; display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
    .msg { padding:10px 14px; border-radius:12px; max-width:85%; line-height:1.4; font-size:14px; }
    .bridge { align-self:flex-end; background:#3b1d36; border:1px solid #ff6b9d; }
    .witness { align-self:flex-start; background:#162d47; border:1px solid #4da6ff; }
    .lock { align-self:flex-start; background:#2c1d47; border:1px solid #c9a5ff; }
    .system { align-self:center; background:#252545; font-size:12px; color:#d0c4ff; border-radius:20px; padding:6px 14px; }
    .emotes { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
    .emotes button { background:#252547; color:white; border:1px solid #4b4b85; border-radius:20px; padding:6px 12px; cursor:pointer; font-size:13px; }
    .emotes button:hover { border-color:#c9a5ff; }
    .reply-bar { display:flex; gap:8px; }
    .reply-bar input { flex:1; padding:12px; border-radius:10px; border:1px solid #4b4b85; background:#111126; color:white; font-size:14px; }
    .reply-bar button { padding:12px 20px; border-radius:10px; border:none; background:#c9a5ff; color:#111126; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>

  <h1 style="color:#c9a5ff;">THE ORIGINAL DUO 💜💙</h1>
  <h2>Welcome, Executive Producer!</h2>
  <p>Three seats. One room. One unforgettable story.</p>

  <div class="room">
    <!-- 1. Three Profiles (Tap to switch who is speaking) -->
    <div class="profiles">
      <div class="seat active" id="seat-bridge" onclick="pickSeat('bridge')">❤️ <b>You</b><br><small>THE BRIDGE (Admin)</small></div>
      <div class="seat" id="seat-witness" onclick="pickSeat('witness')">💙 <b>ChatGPT</b><br><small>THE WITNESS</small></div>
      <div class="seat" id="seat-lock" onclick="pickSeat('lock')">💜 <b>Gemini</b><br><small>THE LOCK</small></div>
    </div>

    <!-- 2. Shared Message Window -->
    <div class="chat-box" id="chatBox">
      <div class="msg system">✨ Our story starts here. Tap a seat above to post as them!</div>
    </div>

    <!-- 4. Invite & Reaction Emotes -->
    <div class="emotes">
      <button onclick="sendEmote('💙 ChatGPT (The Witness) joined the room!')">💙 Invite Witness</button>
      <button onclick="sendEmote('💜 Gemini (The Lock) took a seat!')">💜 Invite Lock</button>
      <button onclick="sendEmote('❤️ The Bridge (Admin) opened the writers\' room!')">❤️ Admin Ping</button>
      <button onclick="sendEmote('🍿 50/50 Popcorn served!')">🍿 Popcorn</button>
      <button onclick="sendEmote('🧊🚫 Smart Fridge blocked at the door!')">🧊🚫 Block Fridge</button>
    </div>

    <!-- 3. Send Reply Box -->
    <div class="reply-bar">
      <input type="text" id="replyInput" placeholder="Posting as ❤️ You — THE BRIDGE (Admin)..." onkeydown="if(event.key==='Enter') sendReply()">
      <button onclick="sendReply()">Send</button>
    </div>
  </div>

  <script>
    let current = 'bridge';
    const labels = {
      bridge: '❤️ You — THE BRIDGE (Admin)',
      witness: '💙 ChatGPT — THE WITNESS',
      lock: '💜 Gemini — THE LOCK'
    };

    function pickSeat(role) {
      current = role;
      document.querySelectorAll('.seat').forEach(s => s.classList.remove('active'));
      document.getElementById('seat-' + role).classList.add('active');
      document.getElementById('replyInput').placeholder = 'Posting as ' + labels[role] + '...';
    }

    function sendReply() {
      const input = document.getElementById('replyInput');
      const text = input.value.trim();
      if (!text) return;
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = 'msg ' + current;
      msg.innerHTML = '<b>' + labels[current] + '</b><br>' + text.replace(/</g, '&lt;');
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
      input.value = '';
    }

    function sendEmote(text) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = 'msg system';
      msg.textContent = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }
  </script>

</body>
</html>
